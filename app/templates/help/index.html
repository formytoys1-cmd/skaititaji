{% extends "base.html" %}
{% block title %}{{ t('help.title') }} — {{ app_name }}{% endblock %}
{% block content %}
<section class="max-w-4xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold">{{ t('help.title') }}</h1>
  <p class="text-slate-500 mt-2">{{ t('help.subtitle') }}</p>

  <div class="grid md:grid-cols-3 gap-4 mt-8">
    {% for c in cards %}
    <a href="/palidziba/{{ c.slug }}" class="bg-white rounded-2xl border border-slate-200 p-6 hover:border-brand transition">
      <div class="text-3xl">{{ c.icon }}</div>
      <h3 class="font-semibold mt-3">{{ c.title }}</h3>
      <p class="brand-text text-sm mt-3">{{ t('help.open') }}</p>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
