{% extends "base.html" %}
{% block title %}Ieeja — {{ app_name }}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl border border-slate-200 p-8">
    <h1 class="text-2xl font-bold">Ieeja</h1>
    <p class="text-slate-500 text-sm mt-1">Ievadiet e-pastu un paroli.</p>

    <form method="post" action="/login" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">E-pasts</label>
        <input name="email" type="email" required autofocus
               class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:brand-border outline-none"
               placeholder="resident@demo.lv">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Parole</label>
        <input name="password" type="password" required
               class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:brand-border outline-none"
               placeholder="demo1234">
      </div>
      <button class="w-full py-2.5 rounded-lg brand-bg text-white font-semibold">Ieiet</button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400 mb-2">Ražošanā plānots: Smart-ID · eParaksts · banku autentifikācija</p>
      <div class="flex gap-2 opacity-50">
        <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-xs">Smart-ID</span>
        <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-xs">eParaksts</span>
        <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-xs">Internetbanka</span>
      </div>
    </div>
    <p class="mt-4 text-sm text-slate-500">Nav konta? <a href="/demo" class="brand-text">Skatīt demo piekļuvi →</a></p>
  </div>
</section>
{% endblock %}
