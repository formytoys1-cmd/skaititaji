{% extends "base.html" %}
{% block title %}eIDAS — {{ app_name }}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl border border-slate-200 p-8">
    <h1 class="text-2xl font-bold">Ienākt ar eIDAS</h1>
    <p class="text-slate-500 text-sm mt-1">Banka / Smart-ID / eParaksts</p>

    <div class="flex gap-2 flex-wrap mt-4">
      <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs">Smart-ID</span>
      <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs">eParaksts</span>
      <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs">Internetbanka</span>
    </div>

    <form method="post" action="/eidas/login" class="mt-6 space-y-4" onsubmit="lockSubmit(this)">
{% include "_csrf.html" %}
      <div>
        <label for="identifier" class="block text-sm font-medium mb-1">Personas kods / identifikators</label>
        <input id="identifier" name="identifier" type="text" required autofocus
               class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:brand-border outline-none"
               placeholder="PNOLV-321054-12345">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg brand-bg text-white font-semibold">Turpināt</button>
    </form>

    <p class="mt-6 text-sm text-slate-500">
      <a href="/login" class="brand-text underline">← Ienākt ar e-pastu un paroli</a>
    </p>
  </div>
</section>
{% endblock %}
