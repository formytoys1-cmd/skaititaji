name: reference-monitor
# Следит, что справка актуальна, а QR/демо работают на проде.
# Гоняет tools/reference_check.py: health, QR (/qr/*.svg), /koplietosana,
# демо-ссылки (/login?demo=), SEC-001 (/demo-login=404) и реальный демо-вход.
# При поломке заводит issue (без дублей) и падает красным.
on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "httpx>=0.27"
      - name: Run reference/QR/demo check
        id: check
        continue-on-error: true
        run: |
          set +e
          out=$(python tools/reference_check.py 2>&1)
          code=$?
          echo "$out"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open issue on failure (dedup)
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT || "(нет вывода)";
            const label = "reference-monitor";
            const title = "🚨 Reference-monitor: справка/QR/демо сломаны на проде";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const body = [
              "Автоматическая проверка `tools/reference_check.py` упала.",
              "",
              "```",
              report.slice(0, 5000),
              "```",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, "monitoring"],
              });
            }
        env:
          REPORT: ${{ steps.check.outputs.report }}
      - name: Fail job if check failed
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "reference_check.py exit=${{ steps.check.outputs.exit_code }}"
          exit 1
