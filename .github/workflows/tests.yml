# Тесты и контроль качества кода (мандат аудитора, docs/AUDIT_MANDATE_QA_AGENT.md).
# Последовательность (Часть 4): lint (ruff) → unit → integration → security →
# gate покрытия ключевых модулей (≥ 80%). Падение — блок мержа.
name: tests
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests

  pytest:
    name: Pytest (unit + integration + security) + coverage gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage gate (key modules >= 80%)
        run: |
          python -m pytest tests/unit tests/integration tests/security \
            --cov=app.auth --cov=app.config --cov=app.services \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
