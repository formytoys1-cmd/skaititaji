# Google App Engine (Standard, Python) — деплой: gcloud app deploy
runtime: python312

entrypoint: uvicorn app.main:app --host 0.0.0.0 --port $PORT

instance_class: F1

env_variables:
  VISMA_MOCK: "1"
  # SECRET_KEY: задайте секрет для продакшена

handlers:
  - url: /static
    static_dir: app/static
  - url: /.*
    script: auto

automatic_scaling:
  min_instances: 0
  max_instances: 1
