# Render.com Blueprint — авто-деплой из Git-репозитория.
# Документация: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: skaititaji-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: VISMA_MOCK
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.6"
